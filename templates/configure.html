<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/static/favicon.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<title>AniBox — Configure</title>
<script>
  // Dark mode is the default; respect a stored preference.
  (function(){
    try {
      if (localStorage.getItem('anibox-theme') === 'light') {
        document.documentElement.classList.remove('dark');
        document.documentElement.classList.add('light');
      }
    } catch(e){}
  })();
</script>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

  :root {
    --bg: #ffffff;
    --surface: #ffffff;
    --border: #d7dbdf;
    --ink: #1a2029;
    --ink-muted: #5b6470;
    --ink-faint: #8a93a0;
    --accent: #2563eb;
    --accent-soft: #eff4ff;
    --green: #16a34a;
    --toggle-off: #d7dbdf;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  html.dark {
    --bg: #0f1115;
    --surface: #171a20;
    --border: #2a2f39;
    --ink: #e7ebf0;
    --ink-muted: #9aa3b0;
    --ink-faint: #6b7280;
    --accent: #3b82f6;
    --accent-soft: #1b2740;
    --green: #22c55e;
    --toggle-off: #3a404b;
  }

  html { font-size: 16px; -webkit-font-smoothing: antialiased; background: var(--bg); color: var(--ink); }
  body { font-family: var(--font); line-height: 1.5; transition: background 0.2s, color 0.2s; }

  .shell { max-width: 40rem; margin: 0 auto; padding: 2rem 1.25rem 3rem; }

  header { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1.5rem; }
  header img { width: 2.25rem; height: 2.25rem; object-fit: contain; }
  header h1 { font-size: 1.25rem; font-weight: 700; }

  .mode-toggle {
    margin-left: auto; display: inline-flex; align-items: center; gap: 0.4rem;
    font-size: 0.8125rem; color: var(--ink-muted); cursor: pointer; user-select: none;
  }
  .mode-toggle .switch {
    position: relative; width: 2.5rem; height: 1.5rem; flex-shrink: 0; cursor: pointer;
  }
  .mode-toggle .switch input { opacity: 0; width: 0; height: 0; position: absolute; }
  .mode-toggle .track { position: absolute; inset: 0; background: var(--toggle-off); border-radius: 999px; transition: background 0.15s; }
  .mode-toggle input:checked + .track { background: var(--accent); }
  .mode-toggle .knob { position: absolute; top: 0.125rem; left: 0.125rem; width: 1.25rem; height: 1.25rem; background: #fff; border-radius: 50%; transition: transform 0.15s; box-shadow: 0 1px 2px rgba(0,0,0,0.2); }
  .mode-toggle input:checked ~ .knob { transform: translateX(1rem); }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 0.5rem; padding: 1.25rem 1.5rem; margin-bottom: 1.25rem; }
  .card h2 { font-size: 1rem; font-weight: 600; margin-bottom: 0.25rem; }
  .card .hint { font-size: 0.8125rem; color: var(--ink-muted); margin-bottom: 1rem; }

  .row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 0.85rem 0; }
  .row + .row { border-top: 1px solid var(--border); }
  .row-label { flex: 1; min-width: 0; }
  .row-label h3 { font-size: 0.9375rem; font-weight: 600; }
  .row-label p { font-size: 0.8125rem; color: var(--ink-muted); }

  .toggle { position: relative; width: 2.5rem; height: 1.5rem; flex-shrink: 0; cursor: pointer; }
  .toggle input { opacity: 0; width: 0; height: 0; position: absolute; }
  .toggle-track { position: absolute; inset: 0; background: var(--toggle-off); border-radius: 999px; transition: background 0.15s; }
  .toggle input:checked + .toggle-track { background: var(--accent); }
  .toggle-knob { position: absolute; top: 0.125rem; left: 0.125rem; width: 1.25rem; height: 1.25rem; background: #fff; border-radius: 50%; transition: transform 0.15s; box-shadow: 0 1px 2px rgba(0,0,0,0.2); }
  .toggle input:checked ~ .toggle-knob { transform: translateX(1rem); }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem; border: 1px solid var(--border); background: var(--surface); color: var(--ink); border-radius: 0.4rem; padding: 0.6rem 1rem; font-size: 0.875rem; font-weight: 600; cursor: pointer; }
  .btn:hover { border-color: var(--ink-faint); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-primary:hover { filter: brightness(1.05); }
  .btn-sm { padding: 0.35rem 0.7rem; font-size: 0.75rem; }

  .url-box { margin-top: 0.75rem; padding: 0.7rem 0.85rem; background: var(--accent-soft); border: 1px solid var(--border); border-radius: 0.4rem; word-break: break-all; font-size: 0.78rem; color: var(--ink-muted); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .actions { display: flex; gap: 0.625rem; flex-wrap: wrap; margin-top: 1rem; }
  .stats { display: flex; gap: 1.5rem; margin-bottom: 1.25rem; }
  .stat { font-size: 0.8125rem; color: var(--ink-muted); }
  .stat b { font-size: 1rem; color: var(--ink); font-weight: 700; }
</style>
</head>
<body>

<div class="shell">

  <header>
    <img src="/static/anibox-icon-512.png" alt="AniBox" onerror="this.src='/static/anibox-mark.png'">
    <h1>AniBox</h1>
    <label class="mode-toggle">
      <span id="mode-label">Dark</span>
      <span class="switch"><input type="checkbox" id="mode-toggle"><span class="track"></span><span class="knob"></span></span>
    </label>
  </header>

  <div class="stats">
    <div class="stat"><b id="stat-prov">0/3</b> Providers</div>
  </div>

  <section class="card">
    <h2>Providers</h2>
    <p class="hint">Stream sources AniBox scrapes on every request. MultiMovies always serves direct CDN links for fast seeking.</p>
    <div class="actions" style="margin-top:0;margin-bottom:1rem;">
      <button class="btn btn-sm" onclick="setAllProviders(true)">Enable all</button>
      <button class="btn btn-sm" onclick="setAllProviders(false)">Disable all</button>
    </div>
    <div class="row-list" id="provider-list"></div>
  </section>

  <section class="card">
    <h2>Install</h2>
    <p class="hint">Paste this manifest URL into any Stremio-compatible app.</p>
    <div class="url-box" id="addon-url"></div>
    <div class="actions">
      <button class="btn btn-primary" onclick="install()">Install in Stremio</button>
      <button class="btn" onclick="copyUrl()" id="copy-btn">Copy URL</button>
    </div>
  </section>

</div>

<script>
const PROVIDERS = [
  {key:'source_multimovies',     name:'MultiMovies',   desc:'Movies + Hindi series', def:true},
  {key:'source_nxsha',           name:'NxSha',         desc:'Movies + series',       def:true},
  {key:'source_watchanimeworld', name:'AnimeWorld',    desc:'Hindi dub series',      def:true},
];

let state = {};

function initState(){
  PROVIDERS.forEach(p => state[p.key] = p.def ? 'on' : 'off');
}

function buildConfig(){
  return Object.fromEntries(Object.entries(state).filter(([k,v]) => v === 'on'));
}

function encodeConfig(config){
  const json = JSON.stringify(config);
  return btoa(unescape(encodeURIComponent(json))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/g,'');
}

function getAddonUrl(){
  return window.location.origin + '/' + encodeConfig(buildConfig()) + '/manifest.json';
}

function updateSummary(){
  document.getElementById('stat-prov').textContent = PROVIDERS.filter(p => state[p.key]==='on').length + '/' + PROVIDERS.length;
  document.getElementById('addon-url').textContent = getAddonUrl();
}

function renderProviders(){
  const list = document.getElementById('provider-list');
  list.innerHTML = '';
  PROVIDERS.forEach(p => {
    const row = document.createElement('label');
    row.className = 'row';
    row.innerHTML =
      '<div class="row-label"><h3>' + p.name + '</h3><p>' + p.desc + '</p></div>' +
      '<input type="checkbox" class="prov-chk"' + (state[p.key]==='on' ? ' checked' : '') + '>';
    row.querySelector('input').onchange = (e) => { state[p.key] = e.target.checked ? 'on' : 'off'; updateSummary(); };
    list.appendChild(row);
  });
}

function setAllProviders(on){
  PROVIDERS.forEach(p => state[p.key] = on ? 'on' : 'off');
  renderProviders(); updateSummary();
}

function renderAll(){
  renderProviders(); updateSummary();
}

function install(){
  setTimeout(() => { window.location.href = 'stremio://' + getAddonUrl().replace(/^https?:\/\//,''); }, 400);
}

function copyUrl(){
  navigator.clipboard.writeText(getAddonUrl()).then(() => {
    const b = document.getElementById('copy-btn');
    if (b) { b.textContent = 'Copied!'; setTimeout(() => { b.textContent = 'Copy URL'; }, 2000); }
  });
}

// ─── Light / dark mode (dark default) ───
function applyTheme(mode){
  const root = document.documentElement;
  if (mode === 'light') { root.classList.add('light'); root.classList.remove('dark'); }
  else { root.classList.add('dark'); root.classList.remove('light'); }
  document.getElementById('mode-label').textContent = mode === 'light' ? 'Light' : 'Dark';
  try { localStorage.setItem('anibox-theme', mode); } catch(e){}
}
function currentMode(){
  try { return localStorage.getItem('anibox-theme') || 'dark'; }
  catch(e){ return 'dark'; }
}
const modeToggle = document.getElementById('mode-toggle');
modeToggle.checked = currentMode() === 'light';
modeToggle.addEventListener('change', () => applyTheme(modeToggle.checked ? 'light' : 'dark'));
applyTheme(currentMode());

initState();
renderAll();
</script>

</body>
</html>
